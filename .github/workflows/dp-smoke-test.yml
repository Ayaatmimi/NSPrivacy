name: DP pipeline smoke test

on:
  push:
    paths:
      - "NSPrivacy/dp_pipeline/**"
      - ".github/workflows/dp-smoke-test.yml"
  pull_request:
    paths:
      - "NSPrivacy/dp_pipeline/**"
      - ".github/workflows/dp-smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NSPrivacy/dp_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: NSPrivacy/dp_pipeline/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic smoke test
        run: python smoke_test.py
